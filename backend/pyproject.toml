[project]
name = "shuangling-k12-backend"
version = "0.1.0"
description = "Synthetic-first local business backend for the Shuangling K12 platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "jsonschema>=4.23,<5",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
