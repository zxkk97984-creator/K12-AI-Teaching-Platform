server {
    listen 15173;
    server_name _;
    root /usr/share/nginx/html;
    # Docker service IPs change when Compose recreates a container. Resolve the
    # service name at request time instead of pinning the API IP at nginx start.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:18081;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        set $api_upstream http://api:18081;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
